[project]
name = "arxiv2epub"
version = "0.1.0"
description = "Convert arXiv papers (via LaTeXML) into Kindle-friendly EPUBs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amin Shabani" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "pymupdf>=1.24",
    "pillow>=10.0",
]

[project.urls]
Repository = "https://github.com/aminshabani/arxiv2epub"

[project.scripts]
arxiv2epub = "arxiv2epub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv2epub"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
markers = ["e2e: end-to-end tests that hit the network and need LaTeXML"]
addopts = "-m 'not e2e'"
filterwarnings = ["ignore:builtin type:DeprecationWarning"]
